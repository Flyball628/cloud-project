name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
  SWR_ORG: cloudcourse

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          provenance: false
          tags: |
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/backend:${{ github.sha }}
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/backend:v1
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: |
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/frontend:${{ github.sha }}
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/frontend:v1
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/frontend:latest
