apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: mnist-ddp-training
  namespace: default
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
          - name: pytorch
            image: pytorch/pytorch:2.0.1-cpu
            command:
            - sh
            - -c
            - |
              python /opt/ml/train_mnist_ddp.py --mode ddp --epochs 5
            volumeMounts:
            - name: ml-code
              mountPath: /opt/ml
            env:
            - name: MASTER_ADDR
              value: mnist-ddp-training-master-0.mnist-ddp-training
            - name: MASTER_PORT
              value: "29500"
            - name: WORLD_SIZE
              value: "3"
            - name: RANK
              value: "0"
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "200m"
                memory: "512Mi"
          volumes:
          - name: ml-code
            configMap:
              name: ml-code
    Worker:
      replicas: 2
      restartPolicy: OnFailure
      template:
        spec:
          containers:
          - name: pytorch
            image: pytorch/pytorch:2.0.1-cpu
            command:
            - sh
            - -c
            - |
              python /opt/ml/train_mnist_ddp.py --mode ddp --epochs 5
            volumeMounts:
            - name: ml-code
              mountPath: /opt/ml
            env:
            - name: MASTER_ADDR
              value: mnist-ddp-training-master-0.mnist-ddp-training
            - name: MASTER_PORT
              value: "29500"
            - name: WORLD_SIZE
              value: "3"
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "200m"
                memory: "512Mi"
          volumes:
          - name: ml-code
            configMap:
              name: ml-code
