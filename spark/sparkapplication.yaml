apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: pyspark-analysis
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: swr.cn-east-3.myhuaweicloud.com/cloudcourse/pyspark:v9
  mainApplicationFile: local:///opt/spark/work/comparison.py
  sparkVersion: "3.4.0"
  restartPolicy:
    type: Never
  sparkConf:
    "spark.hadoop.fs.s3a.endpoint": "obs.cn-east-3.myhuaweicloud.com"
    "spark.hadoop.fs.s3a.access.key": "HPUAZAP86RMRMPYTTCPE"
    "spark.hadoop.fs.s3a.secret.key": "b55UlWKdU5RIHlikZr4VveDjcTIrnI3AO4izENnn"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.path.style.access": "false"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "true"
  driver:
    cores: 1
    coreRequest: "200m"
    memory: "512m"
    memoryOverhead: "128m"
    serviceAccount: spark
    volumeMounts:
      - name: analysis-script
        mountPath: /opt/spark/work
  executor:
    cores: 1
    coreRequest: "200m"
    instances: 2
    memory: "512m"
    memoryOverhead: "128m"
    volumeMounts:
      - name: analysis-script
        mountPath: /opt/spark/work
  volumes:
    - name: analysis-script
      configMap:
        name: spark-analysis-script
